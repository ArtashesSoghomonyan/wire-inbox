[project]
name = "backend"
version = "0.1.0"
description = "An online chat web app built with django and next.js"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.2.16",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.17.1",
    "djangorestframework-simplejwt>=5.5.1",
    "environs>=15.0.1",
    "pillow>=12.3.0",
    "psycopg2-binary>=2.9.12",
    "requests>=2.34.2",
]

[dependency-groups]
dev = ["black>=26.5.1", "django-extensions>=4.1", "flake8>=7.3.0"]
